name: Gravitas
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, deploy/gravitas]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gravitas-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test backend in production toolchain
        run: docker build --target backend-test .
      - name: Test frontend in production toolchain
        run: docker build --target frontend-test .
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable release
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/jeethsuresh/rss:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GRAVITAS_DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: gravitas
      url: "https://news.gravitas.cool"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch pinned private deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jeethsuresh/gravitas-deploy
          ref: 1672e6fef247f5ba36ed07ac178dc41482cddaba
          path: .gravitas-runtime
          ssh-key: ${{ secrets.GRAVITAS_TOOLING_SSH_KEY }}
          persist-credentials: false
      - name: Deploy and verify immutable release
        uses: ./.gravitas-runtime
        with:
          config: .gravitas/deploy.json
          image: ghcr.io/jeethsuresh/rss@${{ needs.image.outputs.digest }}
          kubeconfig: ${{ secrets.GRAVITAS_KUBECONFIG }}
