appId: com.jeeth.rssreader
productName: RSS Reader
executableName: rss-reader
directories:
  output: release
files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json
extraResources:
  - from: resources/bin/
    to: bin
    filter:
      - rss-backend
      - rss-backend.exe
publish:
  provider: github
  owner: jeethsuresh
  repo: rss
mac:
  target:
    - dmg
  category: public.app-category.news
win:
  target:
    - nsis
linux:
  category: News
  synopsis: Local-first RSS reader
  description: Desktop RSS reader with a local Go backend and SQLite storage.
  maintainer: Jeeth <jeeth@users.noreply.github.com>
  target:
    - deb
    - rpm
    - pacman
    - AppImage
# Spaces break rpmbuild/fpm package names and paths.
deb:
  packageName: rss-reader
rpm:
  packageName: rss-reader
pacman:
  packageName: rss-reader
artifactName: RSS-Reader-${version}-${os}-${arch}.${ext}
