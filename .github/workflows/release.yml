name: Desktop installers (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Skip code-signing discovery so unsigned CI builds do not hang.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            runs-on: macos-15
            goos: darwin
            goarch: arm64
            electron_args: --mac --arm64
            artifact_glob: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/latest-mac.yml

          - name: windows-x64
            runs-on: windows-latest
            goos: windows
            goarch: amd64
            electron_args: --win --x64
            artifact_glob: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.msi
              apps/desktop/release/latest.yml

          - name: linux-x64
            # Pin 22.04 for broader glibc compatibility of AppImage/deb/rpm.
            runs-on: ubuntu-22.04
            goos: linux
            goarch: amd64
            electron_args: --linux deb rpm pacman AppImage --x64
            artifact_glob: |
              apps/desktop/release/*.deb
              apps/desktop/release/*.rpm
              apps/desktop/release/*.pacman
              apps/desktop/release/*.AppImage
              apps/desktop/release/latest-linux.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Setup Node (electron-builder)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux packagers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Ubuntu/Debian: `rpm` provides rpmbuild. There is no `rpm-build` package
          # (that name is Fedora/RHEL-only).
          sudo apt-get install -y --no-install-recommends \
            rpm \
            libarchive-tools \
            libfuse2 \
            fakeroot

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stage Go backend
        shell: bash
        run: |
          chmod +x scripts/stage-backend.sh
          ./scripts/stage-backend.sh "${{ matrix.goos }}" "${{ matrix.goarch }}"

      - name: Build desktop (renderer + electron)
        run: bun run --filter @rss-reader/desktop build

      - name: Package with electron-builder
        working-directory: apps/desktop
        shell: bash
        run: |
          bun x electron-builder --config electron-builder.yml ${{ matrix.electron_args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release outputs
        shell: bash
        run: ls -la apps/desktop/release || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14
