name: RSSReader
options:
  bundleIdPrefix: com.jeeth
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
targets:
  RSSReader:
    type: application
    platform: iOS
    sources:
      - RSSReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeeth.rssreader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_CFBundleDisplayName: RSS Reader
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - RSSReaderTests
  RSSReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RSSReaderTests
    dependencies:
      - target: RSSReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeeth.rssreader.tests
        GENERATE_INFOPLIST_FILE: YES
