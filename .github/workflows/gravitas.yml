name: Gravitas
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, deploy/gravitas]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gravitas-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test backend in production toolchain
        run: docker build --target backend-test .
      - name: Test frontend in production toolchain
        run: docker build --target frontend-test .
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable release
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/jeethsuresh/rss:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [image, desktop-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: gravitas
      url: "https://news.gravitas.cool"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch pinned private deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jeethsuresh/gravitas-deploy
          ref: 1672e6fef247f5ba36ed07ac178dc41482cddaba
          path: .gravitas-runtime
          ssh-key: ${{ secrets.GRAVITAS_TOOLING_SSH_KEY }}
          persist-credentials: false
      - name: Deploy and verify immutable release
        uses: ./.gravitas-runtime
        with:
          config: .gravitas/deploy.json
          image: ghcr.io/jeethsuresh/rss@${{ needs.image.outputs.digest }}
          kubeconfig: ${{ secrets.GRAVITAS_KUBECONFIG }}

  desktop:
    name: Native desktop (${{ matrix.platform }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, arch: x64}
          - {os: windows-2022, platform: windows, arch: x64}
          - {os: macos-15, platform: macos, arch: arm64}
          - {os: macos-15-intel, platform: macos, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate desktop version and changelog contract
        run: python3 scripts/test-desktop-release.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libgbm1 libasound2t64 xvfb
      - name: Build and exercise the complete native application
        if: runner.os != 'Linux'
        run: python3 scripts/desktop-build.py '${{ matrix.platform }}' '${{ matrix.arch }}'
      - name: Build and exercise the complete native Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/desktop-build.py linux x64
      - name: Verify reconciled reader, mobile navigation, auth and offline behavior
        if: runner.os == 'Linux'
        run: |
          bun x --no-install playwright install --with-deps chromium
          node scripts/test-pwa.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop-dist/*.zip
          if-no-files-found: error
          retention-days: 7

  desktop-verify:
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: desktop-dist
          merge-multiple: true
      - name: Verify all native targets and stage immutable Store metadata
        run: python3 scripts/desktop-release.py stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-desktop-release
          path: desktop-dist/*
          if-no-files-found: error
          retention-days: 7

  desktop-publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [deploy, desktop-verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-desktop-release
          path: desktop-dist
      - name: Publish verified native apps, changelog and checksums for Private Store
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/desktop-release.py publish
