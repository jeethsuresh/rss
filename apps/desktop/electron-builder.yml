appId: com.jeeth.rssreader
productName: RSS Reader
directories:
  output: release
files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json
extraResources:
  - from: resources/bin/
    to: bin
    filter:
      - rss-backend
      - rss-backend.exe
mac:
  target:
    - dmg
  category: public.app-category.news
win:
  target:
    - nsis
linux:
  category: News
  synopsis: Local-first RSS reader
  description: Desktop RSS reader with a local Go backend and SQLite storage.
  maintainer: Jeeth <jeeth@users.noreply.github.com>
  target:
    # Ubuntu / Debian
    - deb
    # Fedora / RHEL / openSUSE
    - rpm
    # Arch Linux / Manjaro
    - pacman
    # Distro-agnostic fallback
    - AppImage
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
